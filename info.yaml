yaml_version: 6

project:
  title:        "Pipelined INT8 MAC Accelerator"
  author:       "Vinayak S Biradar"
  discord:      ""
  description:  "Pipelined INT8 multiply-accumulate unit for edge AI acceleration."
  language:     "Verilog"
  clock_hz:     50000000

  tiles: "1x1"
  top_module:  "tt_um_example"

  source_files:
    - "project.v"

pinout:
  ui[0]: "Multiplier Operand A bit 0"
  ui[1]: "Multiplier Operand A bit 1"
  ui[2]: "Multiplier Operand A bit 2"
  ui[3]: "Multiplier Operand A bit 3"
  ui[4]: "Multiplier Operand A bit 4"
  ui[5]: "Multiplier Operand A bit 5"
  ui[6]: "Multiplier Operand A bit 6"
  ui[7]: "Multiplier Operand A bit 7"

  uo[0]: "Accumulator Output bit 0"
  uo[1]: "Accumulator Output bit 1"
  uo[2]: "Accumulator Output bit 2"
  uo[3]: "Accumulator Output bit 3"
  uo[4]: "Accumulator Output bit 4"
  uo[5]: "Accumulator Output bit 5"
  uo[6]: "Accumulator Output bit 6"
  uo[7]: "Accumulator Output bit 7"

  uio[0]: "Multiplier Operand B bit 0"
  uio[1]: "Multiplier Operand B bit 1"
  uio[2]: "Multiplier Operand B bit 2"
  uio[3]: "Multiplier Operand B bit 3"
  uio[4]: "Multiplier Operand B bit 4"
  uio[5]: "Multiplier Operand B bit 5"
  uio[6]: "Multiplier Operand B bit 6"
  uio[7]: "Multiplier Operand B bit 7"

documentation:
  author:       "Vinayak S Biradar"
  title:        "Pipelined INT8 MAC Accelerator"
  language:     "Verilog"
  description:  "Pipelined signed INT8 multiply-accumulate unit with internal 32-bit accumulator."
  how_it_works: "Registers 8-bit inputs, calculates 16-bit signed product in stage 2, and accumulates in stage 3."
  how_to_test:  "Feed signed 8-bit values to ui_in and uio_in on clock cycles with rst_n high and ena high."
  external_hw:  "None"
  doc_version:  "1.0"
