# Tiny Tapeout project information
project:
  title:        "Pipelined INT8 MAC Hardware Accelerator"
  author:       "Vinayak S Biradar"
  discord:      ""
  description:  "A 3-stage pipelined INT8 Multiply-Accumulate unit with 32-bit accumulation for edge AI acceleration."
  language:     "Verilog"
  clock_hz:     50000000

  # How many tiles your design occupies? A single tile is 1x1.
  tiles: "1x1"

  # Your top-level Verilog module name (must match src/project.v)
  top_module:  "tt_um_example"

  # List your source files here (relative to the repo root)
  source_files:
    - "project.v"

# Pinout mapping for the 8-bit input/output ports
pinout:
  # Dedicated inputs (ui_in)
  ui[0]: "Multiplier Operand A [0]"
  ui[1]: "Multiplier Operand A [1]"
  ui[2]: "Multiplier Operand A [2]"
  ui[3]: "Multiplier Operand A [3]"
  ui[4]: "Multiplier Operand A [4]"
  ui[5]: "Multiplier Operand A [5]"
  ui[6]: "Multiplier Operand A [6]"
  ui[7]: "Multiplier Operand A [7]"

  # Dedicated outputs (uo_out)
  uo[0]: "Accumulator Output [0]"
  uo[1]: "Accumulator Output [1]"
  uo[2]: "Accumulator Output [2]"
  uo[3]: "Accumulator Output [3]"
  uo[4]: "Accumulator Output [4]"
  uo[5]: "Accumulator Output [5]"
  uo[6]: "Accumulator Output [6]"
  uo[7]: "Accumulator Output [7]"

  # Bidirectional I/O configured as inputs for Operand B (uio_in)
  uio[0]: "Multiplier Operand B [0]"
  uio[1]: "Multiplier Operand B [1]"
  uio[2]: "Multiplier Operand B [2]"
  uio[3]: "Multiplier Operand B [3]"
  uio[4]: "Multiplier Operand B [4]"
  uio[5]: "Multiplier Operand B [5]"
  uio[6]: "Multiplier Operand B [6]"
  uio[7]: "Multiplier Operand B [7]"

# Documentation fields required for the verification booklet
documentation:
  author:       "Vinayak S Biradar"
  title:        "Pipelined INT8 MAC Hardware Accelerator"
  language:     "Verilog"
  description:  "Pipelined signed INT8 multiply-accumulate unit with internal 32-bit accumulator."

  how_it_works: >
    Stage 1 registers the 8-bit inputs operand A (ui_in) and operand B (uio_in).
    Stage 2 computes the signed 16-bit product. Stage 3 sign-extends the product
    to 32 bits and accumulates it into an internal register, exposing the lower byte to uo_out.

  how_to_test: >
    Apply clk pulses with rst_n high and ena high. Feed signed 8-bit values to ui_in
    and uio_in. The accumulated result appears at uo_out after the 3-cycle pipeline latency.

  external_hw:  "None required. Direct clock and pin toggling."

  doc_version:  "1.0"
